# rumdl configuration file
[global]
respect-gitignore = true

[MD013]
line-length = 0
# Exclude code blocks from line length check
code-blocks = false
# Exclude tables from line length check
tables = false
# Enable automatic line wrapping (required for --fix)
reflow = true

[MD033]
allowed-elements = ["kbd", "details", "summary"]

[per-file-ignores]
"docs/SUMMARY.md" = ["MD025"] # Allow multiple H1 in table of contents
