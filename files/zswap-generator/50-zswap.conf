# This configuration comes from script by Jonas Dreßler

# Set swappiness to 133, as IO cost is actually a bit faster than page cache because zswap is also compressed.
#
# Quoting kernel docs:
# At 100, the VM assumes equal IO cost and will thus apply memory pressure to the page cache and swap-backed pages equally;
# For in-memory swap, like zram or zswap, as well as hybrid setups that have swap on faster devices than the filesystem,
# values beyond 100 can be considered. For example, if the random IO against the swap device is on average 2x faster
# than IO from the filesystem, swappiness should be 133 (x + 2x = 200, 2x = 133.33).
#
#
# The difference here isn't really noticable, but this is the correct thing to do.
vm.swappiness = 133

# Set the watermark scale factor to 200 from the 10 default.
#
# Quoting kernel docs:
# This factor controls the aggressiveness of kswapd. It defines the amount of memory left in a node/system before
# kswapd is woken up and how much memory needs to be free before kswapd goes back to sleep.
# The unit is in fractions of 10,000. The default value of 10 means the distances between watermarks are 0.1% of
# the available memory in the node/system. The maximum value is 3000, or 30% of memory.
#
#
# If we set this too high, kswapd will simply always be active.
#
# Testing this with a scale factor of 500, and opening loooots of firefox tabs, the system remains *way*
# more responsive while swapping out, both when compressing without writing to disk, and when compressed
# ram has filled up and we're only writing back to disk.
#
# Let's be a bit more conservative and set it to 200, ie. 2% of system memory between watermarks.
# Definitely needs some more careful measuring though.
vm.watermark_scale_factor = 200

# Disable watermark boost mechanism
#
# apparently this mechanism sucks, and can make things worse, and is also getting
# removed sooner or later.
#
# See https://lore.kernel.org/all/20260520150018.2491267-6-riel@surriel.com/
vm.watermark_boost_factor = 0
