environment:
  PATH: /usr/recc/bin:/usr/bin
  RECC_SERVER: unix:/tmp/casd.sock
  RECC_DEPS_GLOBAL_PATHS: true
  RECC_NO_PATH_REWRITE: true
  RECC_INVALID_INPUT_PATHS_REGEX: .*/CMakeFiles/CMakeScratch/.*,.*/Modules/CMakeCCompilerABI.c,.*/Modules/CMakeCXXCompilerABI.cpp,.*/conftest.*

  (?):
  - recc == "passthrough":
      RECC_PASSTHROUGH: true
  - recc == "cache-only":
      RECC_CACHE_ONLY: true
  - recc == "upload-local-build":
      RECC_CACHE_ONLY: true
      RECC_CACHE_UPLOAD_LOCAL_BUILD: true
  - recc_localcas:
      RECC_USE_LOCALCAS: true
  - recc_jobserver:
      RECC_USE_JOBSERVER: true
  # From https://github.com/bazelbuild/remote-apis/blob/main/build/bazel/remote/execution/v2/platform.md
  - arch == "aarch64":
      # https://gitlab.com/BuildGrid/buildbox/buildbox/-/work_items/186
      RECC_REMOTE_PLATFORM_ISA: aarch64
  - arch == "x86_64":
      RECC_REMOTE_PLATFORM_ISA: x86-64
  - arch == "ppc64le":
      RECC_REMOTE_PLATFORM_ISA: power-isa-le
  - arch == "riscv64":
      RECC_REMOTE_PLATFORM_ISA: rv64g

environment-nocache:
- RECC_CACHE_ONLY
- RECC_PASSTHROUGH
- RECC_CACHE_UPLOAD_LOCAL_BUILD
- RECC_USE_LOCALCAS
- RECC_USE_JOBSERVER

sandbox:
  remote-apis-socket:
    path: /tmp/casd.sock
    (?):
    - recc == "upload-local-build":
        action-cache-enable-update: true
